<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axon | Atendimento WhatsApp</title>
  
  <!-- Favicon Oficial AXON Símbolo 01 -->
  <link rel="icon" type="image/png" href="img/Logotipo - AXON - Símbolo - 01.png">
  <link rel="shortcut icon" type="image/png" href="img/Logotipo - AXON - Símbolo - 01.png">
  <link rel="apple-touch-icon" href="img/Logotipo - AXON - Símbolo - 01.png">

  <!-- Open Graph para compartilhamento no WhatsApp -->
  <meta property="og:title" content="Axon | Atendimento Oficial WhatsApp">
  <meta property="og:description" content="Conecte-se com nosso atendimento oficial para crédito rápido e seguro.">
  <meta property="og:image" content="img/Logotipo - AXON - Símbolo - 01.png">
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0A0D10;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: var(--font-body);
      margin: 0;
    }
    .redirect-card {
      background: #181D22;
      border: 1px solid #262D35;
      border-radius: 24px;
      padding: 44px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 210, 0, 0.15);
      position: relative;
      overflow: hidden;
    }
    .redirect-card::before {
      content: '';
      position: absolute;
      top: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(255, 210, 0, 0.25) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .redirect-logo {
      width: 86px;
      height: 86px;
      margin: 0 auto 22px;
      border-radius: 22px;
      background: #12161A;
      border: 1.5px solid rgba(255, 210, 0, 0.4);
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(255, 210, 0, 0.2);
      animation: pulse-logo 2s infinite ease-in-out;
    }
    .redirect-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px rgba(255, 210, 0, 0.2); }
      50% { transform: scale(1.06); box-shadow: 0 16px 35px rgba(255, 210, 0, 0.4); }
    }
    .redirect-title {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 10px;
    }
    .redirect-title span {
      color: var(--color-primary);
    }
    .redirect-text {
      font-size: 0.95rem;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .loader-bar {
      width: 100%;
      height: 4px;
      background: #262D35;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .loader-progress {
      width: 30%;
      height: 100%;
      background: var(--color-primary);
      border-radius: 999px;
      animation: progress-slide 1.4s infinite ease-in-out;
    }
    @keyframes progress-slide {
      0% { transform: translateX(-100%); width: 30%; }
      50% { width: 60%; }
      100% { transform: translateX(350%); width: 30%; }
    }
    .direct-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 52px;
      background-color: var(--color-primary);
      color: #0A0D10;
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1rem;
      border-radius: 999px;
      text-decoration: none;
      transition: all var(--transition-fast);
      box-shadow: 0 10px 25px rgba(255, 210, 0, 0.25);
    }
    .direct-btn:hover {
      background-color: var(--color-primary-hover);
      transform: translateY(-2px);
    }
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #64748B;
      margin-top: 18px;
    }
    .security-note svg {
      color: var(--color-primary);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-logo">
      <img src="img/Logotipo - AXON - Símbolo - 01.png" alt="Axon Símbolo">
    </div>
    <h1 class="redirect-title">Conectando ao <span>WhatsApp</span></h1>
    <p class="redirect-text">
      Preparando sua proposta e abrindo o atendimento seguro com um especialista da <strong>Axon</strong>.
    </p>

    <div class="loader-bar">
      <div class="loader-progress"></div>
    </div>

    <a id="btn-manual-redirect" href="#" class="direct-btn">
      Abrir Conversa Agora
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </a>

    <div class="security-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Atendimento Oficial: +55 11 94238-3794
    </div>
  </div>

  <script>
    // Recupera os parâmetros da URL
    const params = new URLSearchParams(window.location.search);
    const msg = params.get('msg') || 'Olá! Fiz uma simulação na Axon e gostaria de dar continuidade à contratação sem burocracia.';
    const phone = '5511942383794';
    
    // Link direto do WhatsApp
    const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
    
    document.getElementById('btn-manual-redirect').href = waUrl;

    // Transição suave para o WhatsApp
    setTimeout(() => {
      window.location.href = waUrl;
    }, 700);
  </script>
</body>
</html>
